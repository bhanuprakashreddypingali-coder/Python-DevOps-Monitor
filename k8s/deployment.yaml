apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-devops-monitor
  labels:
    app: python-devops-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-devops-monitor
  template:
    metadata:
      labels:
        app: python-devops-monitor
    spec:
      containers:
        - name: python-devops-monitor
          image: python-devops-monitor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"